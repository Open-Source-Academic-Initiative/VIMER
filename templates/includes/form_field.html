{% if field.field.widget.input_type == "checkbox" %}
    <p>
        <label class="checkbox-label">
            {{ field }} {{ field.label }}
        </label>
        {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
        {{ field.errors }}
    </p>
{% else %}
    <p>
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
        {{ field.errors }}
    </p>
{% endif %}
