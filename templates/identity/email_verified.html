{% extends 'base.html' %}
{% block title %}Verificación de correo - VIMER{% endblock %}
{% block content %}
<h1>Verificación de correo</h1>
<p>{{ message }}</p>
{% if confirmation_required %}
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Confirmar verificación</button>
    </form>
{% elif verified %}
    <p><a href="{% url 'login' %}" class="btn btn-primary">Iniciar sesión</a></p>
{% endif %}
{% endblock %}
