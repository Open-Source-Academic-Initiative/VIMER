{% extends 'base.html' %}
{% block title %}Registro - VIMER{% endblock %}
{% block content %}
<h1>Registro de Usuario y Organización</h1>

<p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
{% endblock %}
