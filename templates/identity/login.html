{% extends 'base.html' %}
{% block title %}Iniciar Sesión - VIMER{% endblock %}
{% block content %}
<h2>Iniciar Sesión</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Entrar</button>
</form>
<p>¿No tienes cuenta? <a href="{% url 'signup' %}">Regístrate aquí</a></p>
{% endblock %}
