server_tokens off;

limit_req_zone $binary_remote_addr zone=vimer_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vimer_signup:10m rate=5r/m;
limit_req_status 429;

upstream vimer_app {
    server web:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://${VIMER_DOMAIN}$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name ${VIMER_DOMAIN};

    if ($host != "${VIMER_DOMAIN}") {
        return 444;
    }

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 55m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # Private attachments can only be reached through an authorized Django
    # response carrying X-Accel-Redirect.
    location ^~ /media/marketplace/attachments/ {
        internal;
        alias /app/media/marketplace/attachments/;
    }

    location /media/ {
        alias /app/media/;
        try_files $uri =404;
    }

    location = /login/ {
        limit_req zone=vimer_auth burst=5 nodelay;
        include /etc/nginx/vimer_proxy.conf;
    }

    location = /signup/ {
        limit_req zone=vimer_signup burst=3 nodelay;
        include /etc/nginx/vimer_proxy.conf;
    }

    location = /password-reset/ {
        limit_req zone=vimer_auth burst=3 nodelay;
        include /etc/nginx/vimer_proxy.conf;
    }

    location ^~ /verificar-correo/ {
        limit_req zone=vimer_auth burst=5 nodelay;
        include /etc/nginx/vimer_proxy.conf;
    }

    location / {
        include /etc/nginx/vimer_proxy.conf;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
