services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DEPLOYMENT_PROFILE: pilot
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
