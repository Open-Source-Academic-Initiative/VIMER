version: "3.8"

services:
  db:
    image: postgres:16.14-alpine3.23@sha256:42b8b8b29c8a4e933d88943e5b03001a78794905cf786e6e7634e9f2abd5a0d3
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-vimer}"
      POSTGRES_USER: "${POSTGRES_USER:-vimer}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: .
    image: vimer:production
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DEPLOYMENT_PROFILE: production
      HEALTHCHECK_HOST: "${VIMER_DOMAIN:?VIMER_DOMAIN is required}"
      TURNSTILE_REQUIRED: "True"
      EMAIL_DELIVERY_REQUIRED: "True"
    depends_on:
      - db
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "/app/deploy/container_healthcheck.py"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  scheduler:
    image: vimer:production
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DEPLOYMENT_PROFILE: production
      RUN_STARTUP_TASKS: "False"
      TURNSTILE_REQUIRED: "True"
      EMAIL_DELIVERY_REQUIRED: "True"
      JOIN_REQUEST_EXPIRY_INTERVAL_SECONDS: "${JOIN_REQUEST_EXPIRY_INTERVAL_SECONDS:-300}"
      CHALLENGE_CLOSURE_INTERVAL_SECONDS: "${CHALLENGE_CLOSURE_INTERVAL_SECONDS:-900}"
      SCHEDULER_RETRY_DELAY_SECONDS: "${SCHEDULER_RETRY_DELAY_SECONDS:-60}"
      SCHEDULER_HEALTH_GRACE_SECONDS: "${SCHEDULER_HEALTH_GRACE_SECONDS:-60}"
    command: ["/app/deploy/scheduler.sh"]
    depends_on:
      - db
      - web
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "/app/deploy/scheduler_healthcheck.py"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.28.3-alpine3.23@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    environment:
      VIMER_DOMAIN: "${VIMER_DOMAIN:?VIMER_DOMAIN is required}"
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/vimer.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/vimer_proxy.conf:ro
      - "${TLS_CERTIFICATE_PATH:?TLS_CERTIFICATE_PATH is required}:/etc/nginx/tls/fullchain.pem:ro"
      - "${TLS_PRIVATE_KEY_PATH:?TLS_PRIVATE_KEY_PATH is required}:/etc/nginx/tls/privkey.pem:ro"
      - "${ACME_CHALLENGE_DIR:-./deploy/acme}:/var/www/certbot:ro"
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health | grep -q '^ok$$'"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  media_data:
  static_data:
