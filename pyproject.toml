[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
# E4/E7/E9: errores de estilo significativos; F: pyflakes (imports muertos,
# nombres indefinidos). Mantiene la disciplina sin reformatear el repo entero.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests.py", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
